name: Checks

# Linting and the browser suite. Deliberately independent of any deployment
# (FR-031), so a failing test and a failing deploy stay distinguishable.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser suite
        id: tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Report failure
        if: failure()
        uses: ./.github/actions/report
        with:
          workflow: Checks
          reason: >-
            ${{ steps.lint.outcome == 'failure' && 'linting failed'
            || steps.tests.outcome == 'failure' && 'the browser suite failed'
            || 'a check step failed' }}
          pull-request: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
